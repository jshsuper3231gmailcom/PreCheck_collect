# =============================================================================
# PreCheck_CollectServer_Auth.conf 운영 가이드
#
# 한 줄 형식: [서버ID][포트][계정][비밀번호]
#   - serverId는 PreCheck_CollectLogs_Schedule.conf의 서버ID와 반드시 일치해야 매칭된다.
#   - override가 필요한 서버만 등록하면 된다. 이 파일에 없는 서버ID는
#     application-prod.yml의 precheck.sftp.port/username/password(전역 기본값)를 그대로 사용한다.
#   - 포트/계정을 비워두면([]) 해당 필드만 전역 기본값으로 대체된다(비밀번호는 보안상
#     빈 값이면 전역 비밀번호로 대체하지 않고 그대로 빈 값 처리 — 반드시 값을 넣을 것).
#   - '#'로 시작하거나 빈 줄은 무시된다.
#
# -----------------------------------------------------------------------------
# 비밀번호 필드는 반드시 ENC(...)로 감싼 암호문을 사용한다 (평문도 동작은 하지만 WARN 로그 남고
# 운영 반입 금지). scripts/encrypt_password.sh로 생성한다.
#
#   최초 1회, 마스터키 생성 후 collect 서버 환경변수로 등록:
#     ./scripts/encrypt_password.sh --gen-key
#     export COLLECT_AUTH_SECRET_KEY="<생성된 값>"   (영구 등록은 서버 환경변수 설정파일에)
#
#   신규 서버 추가 시, 마스터키는 그대로 두고 비밀번호만 암호화:
#     ./scripts/encrypt_password.sh "신규서버비밀번호"
#     -> ENC(...) 출력값을 아래 형식으로 그대로 붙여넣는다.
#
# -----------------------------------------------------------------------------
# [예시 - 아래 ENC(...) 값은 실제 암호문이 아닌 자리표시자다. 반드시 위 스크립트로
#  직접 생성한 값으로 교체할 것]
#
# [pamoap01-자동주문][2201][pamoap01_user][ENC(REPLACE_WITH_REAL_ENCRYPTED_VALUE)]
# [pqgetap1-시세포착1][2202][pqgetap1_user][ENC(REPLACE_WITH_REAL_ENCRYPTED_VALUE)]
# [pqgetap2-시세포착2][][][ENC(REPLACE_WITH_REAL_ENCRYPTED_VALUE)]   # 포트/계정은 전역값 사용, 비밀번호만 override
# =============================================================================
