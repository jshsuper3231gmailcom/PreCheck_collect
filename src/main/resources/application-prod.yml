spring:
  datasource:
    driver-class-name: org.postgresql.Driver
    # TODO: 실제 운영 PostgreSQL host:port/db, 계정으로 교체
    url: jdbc:postgresql://prod-db-host:5432/precheck
    username: precheck
    password: precheck

precheck:
  collect:
    schedule-file-path: /home/precheck/cfg/PreCheck_CollectLogs_Schedule.conf
    holiday-file-path: /home/precheck/cfg/PreCheck_NotifyHoliday_List.conf  # notify와 물리적으로 동일한 파일 공유
    # server-auth-file-path: /home/precheck/cfg/PreCheck_CollectServer_Auth.conf  # 미지정 시 기본값(위 경로) 사용
    file-charset: EUC-KR
  sftp:
    # 아래는 override 파일(PreCheck_CollectServer_Auth.conf)에 없는 서버에 적용되는 전역 기본값
    port: 22
    username: prod_user
    password: prod_pass
    # 서버별 override 비밀번호 복호화에 COLLECT_AUTH_SECRET_KEY 환경변수 필요 (scripts/encrypt_password.sh 참고)
